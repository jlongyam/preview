<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Playground</title>
    <style>
        :root {
            --bg: #f8fafc;
            --panel-bg: #ffffff;
            --border: #e2e8f0;
            --header-bg: #0f172a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --console-bg: #0f172a;
            --console-text: #e2e8f0;
            --log-info: #7dd3fc;
            --log-warn: #fbbf24;
            --log-error: #f87171;
            --subtab-bg: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: #1e293b;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--header-bg);
            color: white;
            flex-shrink: 0;
            z-index: 20;
        }
        header h1 { font-size: 1.1rem; font-weight: 600; }
        .actions button {
            padding: 8px 14px;
            margin-left: 8px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--accent);
            color: white;
            transition: background 0.2s;
        }
        .actions button:active { background: var(--accent-hover); }
        .actions #resetBtn { background: var(--danger); }

        /* Main Tabs */
        .main-tabs {
            display: flex;
            background: #e2e8f0;
            padding: 4px 8px;
            gap: 4px;
            flex-shrink: 0;
            z-index: 15;
        }
        .main-tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: transparent;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .main-tab-btn.active {
            background: var(--panel-bg);
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }

        /* Content Area */
        .tab-content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        .tab-panel {
            display: none;
            flex-direction: column;
            height: 100%;
            background: var(--panel-bg);
            overflow: hidden;
        }
        .tab-panel.active { display: flex; }

        /* ===== SOURCE PANEL - FLEX LAYOUT FIX ===== */
        .source-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }
        
        .editor-area {
            flex: 1;
            padding: 12px;
            overflow: hidden; /* Hide scroll on container, let textarea scroll */
            display: flex;
            flex-direction: column;
        }

        /* TEXTAREA CONTAINER - Flex Column Structure */
        .textarea-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            margin-bottom: 12px;
        }
        
        /* Label - Block, full width, no grow */
        .textarea-container label {
            flex: 0 0 auto;
            display: block;
            width: 100%;
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
            padding: 8px 4px;
            min-height: 2.2em; /* ~2x font-size for touch target */
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .textarea-container label .badge {
            background: var(--accent);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        
        /* Textarea - Block, height 100%, grows to fill container */
        .textarea-container textarea {
            flex: 1 1 auto;
            display: block;
            width: 100%;
            height: 100%;
            min-height: 0; /* CRITICAL: allows flex child to shrink below content */
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 16px;
            resize: none;
            background: #f8fafc;
            line-height: 1.5;
            overflow-y: auto;
        }
        .textarea-container textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            background: #fff;
        }

        .plugin-hint {
            flex: 0 0 auto;
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #64748b;
            margin: 4px 0 8px;
            border-left: 3px solid var(--accent);
        }

        /* Sticky Bottom Sub-Tabs */
        .sub-tabs-container {
            position: sticky;
            bottom: 0;
            background: var(--subtab-bg);
            border-top: 1px solid var(--border);
            padding: 6px 8px;
            z-index: 10;
            flex-shrink: 0;
        }
        .sub-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .sub-tabs::-webkit-scrollbar { display: none; }
        
        .sub-tab-btn {
            flex: 0 0 auto;
            padding: 8px 14px;
            border: none;
            border-radius: 20px;
            background: #e2e8f0;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            color: #475569;
        }
        .sub-tab-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
        }
        .sub-tab-btn:active { transform: scale(0.98); }

        /* Preview Panel */
        .preview-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 12px;
            gap: 10px;
        }
        .preview-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }
        iframe {
            flex: 1;
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: white;
            min-height: 200px;
        }
        .console-container {
            flex: 0.9;
            display: flex;
            flex-direction: column;
            background: var(--console-bg);
            border-radius: 10px;
            overflow: hidden;
            min-height: 150px;
        }
        .console-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #1e293b;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .console-header button {
            background: #334155;
            border: none;
            color: #e2e8f0;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        #consoleOutput {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 13px;
            color: var(--console-text);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-entry { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid #334155; }
        .log-info { color: var(--log-info); }
        .log-warn { color: var(--log-warn); }
        .log-error { color: var(--log-error); }

        /* Desktop */
        @media (min-width: 768px) {
            .main-tabs { padding: 6px 16px; }
            .editor-area { padding: 16px; }
            .preview-panel { padding: 16px; }
            .preview-wrapper { flex-direction: row; }
            iframe { flex: 2; min-height: auto; }
            .console-container { flex: 1; min-height: auto; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🧩 Playground</h1>
        <div class="actions">
            <button id="resetBtn">↺ Reset</button>
            <button id="runBtn">▶ Run</button>
        </div>
    </header>

    <nav class="main-tabs">
        <button class="main-tab-btn active" data-tab="source">Source</button>
        <button class="main-tab-btn" data-tab="preview">Preview</button>
    </nav>

    <main class="tab-content">
        <!-- SOURCE TAB -->
        <section id="source" class="tab-panel active">
            <div class="source-panel">
                <div class="editor-area">
                    <!-- CSS Editor -->
                    <div class="textarea-container" data-editor="css">
                        <label>🎨 CSS <span class="badge">HEAD</span></label>
                        <textarea id="cssCode" placeholder="body { margin: 0; font-family: system-ui; }" spellcheck="false" autocomplete="off"></textarea>
                    </div>
                    
                    <!-- HTML Editor -->
                    <div class="textarea-container" data-editor="html" style="display:none">
                        <label>📝 HTML <span class="badge">MAIN</span></label>
                        <textarea id="htmlCode" placeholder="<h1>Hello World</h1>\n<p>Edit me!</p>" spellcheck="false" autocomplete="off"></textarea>
                    </div>
                    
                    <!-- JS Editor -->
                    <div class="textarea-container" data-editor="js" style="display:none">
                        <label>⚡ JavaScript <span class="badge">FOOTER</span></label>
                        <textarea id="jsCode" placeholder="console.log('Loaded!');" spellcheck="false" autocomplete="off"></textarea>
                    </div>
                    
                    <!-- Head Plugin -->
                    <div class="textarea-container" data-editor="headPlugin" style="display:none">
                        <label>🔌 Head Plugin <span class="badge">EXTERNAL</span></label>
                        <div class="plugin-hint">Add &lt;link&gt;, &lt;meta&gt;, or CDN &lt;script&gt; for &lt;head&gt;</div>
                        <textarea id="headPluginCode" placeholder="<!-- Example: -->\n<link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css'>" spellcheck="false" autocomplete="off"></textarea>
                    </div>
                    
                    <!-- Body Plugin -->
                    <div class="textarea-container" data-editor="bodyPlugin" style="display:none">
                        <label>🔌 Body Plugin <span class="badge">END SCRIPTS</span></label>
                        <div class="plugin-hint">Add scripts that load after your main JS (analytics, widgets)</div>
                        <textarea id="bodyPluginCode" placeholder="<!-- Example: -->\n<script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js'><\/script>" spellcheck="false" autocomplete="off"></textarea>
                    </div>
                </div>

                <!-- Sticky Bottom Sub-Tabs -->
                <div class="sub-tabs-container">
                    <div class="sub-tabs">
                        <button class="sub-tab-btn active" data-subtab="css">CSS</button>
                        <button class="sub-tab-btn" data-subtab="html">HTML</button>
                        <button class="sub-tab-btn" data-subtab="js">JS</button>
                        <button class="sub-tab-btn" data-subtab="headPlugin">🧩 Head</button>
                        <button class="sub-tab-btn" data-subtab="bodyPlugin">🔌 Body</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- PREVIEW TAB -->
        <section id="preview" class="tab-panel">
            <div class="preview-panel">
                <div class="preview-wrapper">
                    <iframe id="previewFrame" sandbox="allow-scripts allow-modals allow-forms"></iframe>
                    <div class="console-container">
                        <div class="console-header">
                            <span>Console</span>
                            <button id="clearConsole">Clear</button>
                        </div>
                        <div id="consoleOutput"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // ===== Elements =====
        const editors = {
            css: document.getElementById('cssCode'),
            html: document.getElementById('htmlCode'),
            js: document.getElementById('jsCode'),
            headPlugin: document.getElementById('headPluginCode'),
            bodyPlugin: document.getElementById('bodyPluginCode')
        };
        const textareaContainers = document.querySelectorAll('.textarea-container');
        const subTabBtns = document.querySelectorAll('.sub-tab-btn');
        const mainTabBtns = document.querySelectorAll('.main-tab-btn');
        const panels = document.querySelectorAll('.tab-panel');
        
        const previewFrame = document.getElementById('previewFrame');
        const consoleOutput = document.getElementById('consoleOutput');
        const runBtn = document.getElementById('runBtn');
        const resetBtn = document.getElementById('resetBtn');
        const clearConsoleBtn = document.getElementById('clearConsole');

        // ===== Tab Switching =====
        mainTabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.dataset.tab;
                mainTabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === target));
                panels.forEach(p => p.classList.toggle('active', p.id === target));
                if (target === 'preview') updatePreview();
            });
        });

        subTabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.dataset.subtab;
                subTabBtns.forEach(b => b.classList.toggle('active', b.dataset.subtab === target));
                textareaContainers.forEach(container => {
                    container.style.display = container.dataset.editor === target ? 'flex' : 'none';
                });
                // Force reflow to ensure flex layout recalculates
                setTimeout(() => {
                    const visible = document.querySelector(`.textarea-container[style*="display: flex"] textarea`);
                    if (visible) {
                        visible.focus();
                        // Trigger resize recalculation
                        visible.style.height = 'auto';
                        visible.style.height = visible.scrollHeight + 'px';
                    }
                }, 50);
            });
        });

        // ===== Console Bridge =====
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'console') {
                const entry = document.createElement('div');
                entry.className = `log-entry log-${e.data.level}`;
                entry.textContent = `[${e.data.level.toUpperCase()}] ${e.data.message}`;
                consoleOutput.appendChild(entry);
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            }
        });

        function clearConsole() { consoleOutput.innerHTML = ''; }
        clearConsoleBtn.addEventListener('click', clearConsole);

        // ===== Build Preview =====
        function updatePreview() {
            clearConsole();
            const doc = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>${editors.css.value}</style>
    ${editors.headPlugin.value}
</head>
<body>
    <main>${editors.html.value}</main>
    <script>
    (function() {
        const methods = ['log', 'warn', 'error', 'info'];
        methods.forEach(m => {
            const orig = console[m];
            console[m] = function(...args) {
                orig.apply(console, args);
                try {
                    const msg = args.map(a => {
                        if (typeof a === 'object') {
                            try { return JSON.stringify(a, null, 2); } 
                            catch(e) { return String(a); }
                        }
                        return String(a);
                    }).join(' ');
                    window.parent.postMessage({ type: 'console', level: m, message: msg }, '*');
                } catch(e) {
                    window.parent.postMessage({ type: 'console', level: m, message: '[Complex Object]' }, '*');
                }
            };
        });
        window.onerror = function(msg, url, line, col) {
            window.parent.postMessage({ 
                type: 'console', 
                level: 'error', 
                message: \`❌ Error: \${msg} (Line \${line}, Col \${col})\` 
            }, '*');
            return true;
        };
    })();
    <\/script>
    <script>${editors.js.value}<\/script>
    ${editors.bodyPlugin.value}
</body>
</html>`;
            previewFrame.srcdoc = doc;
        }

        // ===== Events =====
        runBtn.addEventListener('click', updatePreview);
        resetBtn.addEventListener('click', () => {
            Object.values(editors).forEach(el => el.value = '');
            editors.html.value = '<h1>Hello Playground</h1>\n<p>Tap a sub-tab below to edit.</p>';
            editors.css.value = 'body { padding: 16px; font-family: system-ui; background: #f8fafc; }';
            editors.js.value = 'console.log("✅ Ready");';
            updatePreview();
        });

        let timeout;
        Object.values(editors).forEach(el => {
            el.addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    if (document.querySelector('.main-tab-btn[data-tab="preview"]').classList.contains('active')) {
                        updatePreview();
                    }
                }, 800);
            });
        });

        // ===== Init =====
        editors.html.value = '<h1>Hello Playground</h1>\n<p>Tap a sub-tab below to edit.</p>';
        editors.css.value = 'body { padding: 16px; font-family: system-ui; background: #f8fafc; }';
        editors.js.value = 'console.log("✅ Ready");';
        subTabBtns[0].click();
        updatePreview();
    </script>
</body>
</html>
